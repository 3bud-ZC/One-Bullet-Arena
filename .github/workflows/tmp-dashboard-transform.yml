name: Temporary Dashboard Transform

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  transform:
    if: github.head_ref == 'dashboard-reference-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply dashboard redesign
        run: python tools/apply_dashboard_reference.py
      - name: Static verification
        run: |
          node --check src/core/ui-repair-runtime.js
          node --check src/ui-system.js
          node --check src/i18n.js
          git diff --check
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ui-repair-runtime.js src/ui-system.js src/i18n.js src/release-config.js package.json package-lock.json tests .github/workflows
          git reset .github/workflows/apply-dashboard-reference.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "feat: rebuild dashboard from premium tactical reference [dashboard-applied]"
          git push origin HEAD:${{ github.head_ref }}