name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build verified Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify source and browser contracts
        run: npm run verify:all

      - name: Upload browser verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: pages-verification-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: error

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html game.css manifest.webmanifest sw.js _site/
          cp -R src icons _site/
          touch _site/.nojekyll

          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          printf '{"version":"%s","sha":"%s","channel":"ui-repair"}\n' "$EXPECTED_VERSION" "$GITHUB_SHA" > _site/release.json

          required_files=(
            index.html
            game.css
            sw.js
            manifest.webmanifest
            icons/app-icon.svg
            src/release-config.js
            src/release.js
            src/core/game-events.js
            src/core/event-bus.js
            src/core/game-states.js
            src/core/event-runtime.js
            src/core/combat-depth-runtime.js
            src/core/checkpoint-store.js
            src/core/checkpoint-runtime.js
            src/core/warden-runtime.js
            src/core/world-2d-runtime.js
            src/core/visual-overhaul-runtime.js
            src/core/dashboard-polish-runtime.js
            src/core/world-expansion-runtime.js
            src/core/unified-ui-runtime.js
            src/core/production-art-runtime.js
            src/core/ui-repair-runtime.js
            src/game.js
            src/game-runtime.js
            src/input-controller.js
            src/spawn-system.js
            src/ui-renderer.js
            release.json
          )
          for file in "${required_files[@]}"; do
            test -f "_site/$file"
          done

          grep -Fq "const version = '$EXPECTED_VERSION'" _site/src/release-config.js
          grep -Fq "core/ui-repair-runtime.js" _site/sw.js
          grep -Fq "OneBulletUiRepairRuntime" _site/src/main.js
          grep -Fq "requestFullscreen" _site/src/main.js
          grep -Fq "width: 100vw" _site/game.css
          grep -Fq "height: 100dvh" _site/game.css
          grep -Fq "\"version\":\"$EXPECTED_VERSION\"" _site/release.json
          grep -Fq "\"sha\":\"$GITHUB_SHA\"" _site/release.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy verified artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
          sparse-checkout-cone-mode: false

      - name: Download browser verification evidence
        uses: actions/download-artifact@v4
        with:
          name: pages-verification-${{ github.sha }}
          path: verification-evidence

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages release
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          BASE_URL="${PAGE_URL%/}"
          RELEASE_TARGET="$BASE_URL/release.json?sha=$GITHUB_SHA"
          CONFIG_TARGET="$BASE_URL/src/release-config.js?sha=$GITHUB_SHA"

          echo "Waiting for $EXPECTED_VERSION / $GITHUB_SHA to become live at $BASE_URL"
          for attempt in {1..36}; do
            RELEASE_BODY=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              "$RELEASE_TARGET" || true)
            CONFIG_BODY=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              "$CONFIG_TARGET" || true)

            if grep -Fq "\"version\":\"$EXPECTED_VERSION\"" <<<"$RELEASE_BODY" \
              && grep -Fq "\"sha\":\"$GITHUB_SHA\"" <<<"$RELEASE_BODY" \
              && grep -Fq "const version = '$EXPECTED_VERSION'" <<<"$CONFIG_BODY"; then
              echo "Live Pages release verified: $EXPECTED_VERSION ($GITHUB_SHA)"
              exit 0
            fi

            echo "Attempt $attempt/36: Pages has not converged yet"
            sleep 5
          done

          echo "Live Pages verification failed after deployment."
          echo "release.json response:"
          printf '%s\n' "$RELEASE_BODY"
          echo "release-config.js response:"
          printf '%s\n' "$CONFIG_BODY"
          exit 1

      - name: Persist verified deployment proof
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          SOURCE_SHA="$GITHUB_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deployment-proof

          rm -rf verification
          mkdir -p verification/screenshots
          printf '{\n  "version": "%s",\n  "source_sha": "%s",\n  "page_url": "%s",\n  "live_verified": true,\n  "verify_all_passed": true,\n  "channel": "ui-repair"\n}\n' \
            "$EXPECTED_VERSION" "$SOURCE_SHA" "$PAGE_URL" > verification/deployment-proof.json

          find verification-evidence -type f -name '*.png' -print0 | while IFS= read -r -d '' image; do
            base=$(basename "$image")
            dir=$(basename "$(dirname "$image")")
            cp "$image" "verification/screenshots/${dir}-${base}"
          done

          git add -f verification
          git commit -m "proof: verified Pages $EXPECTED_VERSION at $SOURCE_SHA"
          git push --force origin deployment-proof
