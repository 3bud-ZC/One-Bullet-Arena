<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#02070c" />
    <meta name="description" content="One Bullet Arena — one bullet, tactical ricochets, recovery, and an expanding survival arena." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One Bullet Arena" />
    <title>One Bullet Arena</title>
    <link rel="manifest" href="./manifest.webmanifest?v=3.7.0-hires-ui" />
    <link rel="icon" href="./icons/app-icon.svg?v=3.7.0-hires-ui" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/app-icon.svg?v=3.7.0-hires-ui" />
    <link rel="stylesheet" href="./game.css?v=3.7.0-hires-ui" />
    <link rel="stylesheet" href="./styles/ui.css?v=3.7.0-hires-ui" />
    <link rel="stylesheet" href="./styles/responsive.css?v=3.7.0-hires-ui" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-frame" aria-label="One Bullet Arena">
        <div class="game-render-layer" aria-hidden="false">
          <canvas id="game-canvas" aria-label="One Bullet Arena" aria-describedby="game-instructions"></canvas>
        </div>
        <div id="game-ui-layer" class="game-ui-layer" aria-label="One Bullet Arena interface"></div>
      </section>
      <aside class="orientation-hint" role="status" aria-live="polite">
        <strong>Rotate your device</strong>
        <span>One Bullet Arena is designed for landscape play with both hands.</span>
      </aside>
      <p id="game-instructions" class="visually-hidden">
        One bullet tactical arena game. Move, fire, ricochet, recall the bullet, and choose an upgrade after each wave.
      </p>
      <p id="game-status" class="visually-hidden" aria-live="polite"></p>
    </main>
    <script type="module" src="./src/main.js?v=3.7.0-hires-ui"></script>
  </body>
</html>
