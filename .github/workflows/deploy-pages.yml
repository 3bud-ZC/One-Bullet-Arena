name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build verified Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify source and browser contracts
        run: npm run verify:all

      - name: Upload browser verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: pages-verification-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: error

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html game.css manifest.webmanifest sw.js _site/
          cp -R src icons styles _site/
          touch _site/.nojekyll

          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          printf '{"version":"%s","sha":"%s","channel":"smooth-runtime"}\n' "$EXPECTED_VERSION" "$GITHUB_SHA" > _site/release.json

          required_files=(
            index.html
            game.css
            styles/tokens.css
            styles/ui.css
            styles/responsive.css
            styles/polish.css
            styles/smooth-runtime.css
            sw.js
            manifest.webmanifest
            icons/app-icon.svg
            src/release-config.js
            src/release.js
            src/i18n.js
            src/ui-system.js
            src/performance/frame-pacer.js
            src/performance/quality-manager.js
            src/ui/icons.js
            src/ui/dom-ui.js
            src/ui/dom-performance-bridge.js
            src/render/canvas-viewport.js
            src/core/game-events.js
            src/core/event-bus.js
            src/core/game-states.js
            src/core/event-runtime.js
            src/core/combat-depth-runtime.js
            src/core/checkpoint-store.js
            src/core/checkpoint-runtime.js
            src/core/warden-runtime.js
            src/core/world-2d-runtime.js
            src/core/visual-overhaul-runtime.js
            src/core/dashboard-polish-runtime.js
            src/core/world-expansion-runtime.js
            src/core/unified-ui-runtime.js
            src/core/production-art-runtime.js
            src/core/ui-repair-runtime.js
            src/game.js
            src/game-runtime.js
            src/input-controller.js
            src/spawn-system.js
            src/ui-renderer.js
            release.json
          )
          for file in "${required_files[@]}"; do
            test -f "_site/$file"
          done

          grep -Fq "const version = '$EXPECTED_VERSION'" _site/src/release-config.js
          grep -Fq "channel: 'smooth-runtime'" _site/src/release-config.js
          grep -Fq "src/performance/frame-pacer.js" _site/sw.js
          grep -Fq "src/performance/quality-manager.js" _site/sw.js
          grep -Fq "src/ui/dom-performance-bridge.js" _site/sw.js
          grep -Fq "styles/smooth-runtime.css" _site/sw.js
          grep -Fq "OneBulletGlobalUiRuntime" _site/src/main.js
          grep -Fq "FixedStepClock" _site/src/core/ui-repair-runtime.js
          grep -Fq "AdaptiveQualityManager" _site/src/core/ui-repair-runtime.js
          grep -Fq "CanvasViewport" _site/src/core/ui-repair-runtime.js
          grep -Fq "DomUiController" _site/src/core/ui-repair-runtime.js
          grep -Fq "one-bullet-language" _site/src/i18n.js
          grep -Fq "requestFullscreen" _site/src/main.js
          grep -Fq "width: 100vw" _site/game.css
          grep -Fq "height: 100dvh" _site/game.css
          grep -Fq "\"version\":\"$EXPECTED_VERSION\"" _site/release.json
          grep -Fq "\"sha\":\"$GITHUB_SHA\"" _site/release.json
          grep -Fq '"channel":"smooth-runtime"' _site/release.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy verified artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
          sparse-checkout-cone-mode: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages release
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          BASE_URL="${PAGE_URL%/}"
          RELEASE_TARGET="$BASE_URL/release.json?sha=$GITHUB_SHA"
          CONFIG_TARGET="$BASE_URL/src/release-config.js?sha=$GITHUB_SHA"

          echo "Waiting for $EXPECTED_VERSION / $GITHUB_SHA to become live at $BASE_URL"
          for attempt in {1..36}; do
            RELEASE_BODY=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              "$RELEASE_TARGET" || true)
            CONFIG_BODY=$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              "$CONFIG_TARGET" || true)

            if grep -Fq "\"version\":\"$EXPECTED_VERSION\"" <<<"$RELEASE_BODY" \
              && grep -Fq "\"sha\":\"$GITHUB_SHA\"" <<<"$RELEASE_BODY" \
              && grep -Fq '"channel":"smooth-runtime"' <<<"$RELEASE_BODY" \
              && grep -Fq "const version = '$EXPECTED_VERSION'" <<<"$CONFIG_BODY" \
              && grep -Fq "channel: 'smooth-runtime'" <<<"$CONFIG_BODY"; then
              echo "Live Pages release verified: $EXPECTED_VERSION ($GITHUB_SHA)"
              exit 0
            fi

            echo "Attempt $attempt/36: Pages has not converged yet"
            sleep 5
          done

          echo "Live Pages verification failed after deployment."
          echo "release.json response:"
          printf '%s\n' "$RELEASE_BODY"
          echo "release-config.js response:"
          printf '%s\n' "$CONFIG_BODY"
          exit 1

  diagnostics:
    name: Persist Pages workflow diagnostics
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Capture workflow status and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          mkdir -p verification
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          LIVE_VERIFIED=false
          if [[ "$DEPLOY_RESULT" == "success" ]]; then LIVE_VERIFIED=true; fi

          printf '{\n  "version": "%s",\n  "source_sha": "%s",\n  "run_id": "%s",\n  "build_result": "%s",\n  "deploy_result": "%s",\n  "live_verified": %s,\n  "channel": "smooth-runtime"\n}\n' \
            "$EXPECTED_VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$BUILD_RESULT" "$DEPLOY_RESULT" "$LIVE_VERIFIED" \
            > verification/workflow-status.json

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > verification/workflow-jobs.json

      - name: Publish diagnostics branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deployment-proof
          git add -f verification/workflow-status.json verification/workflow-jobs.json
          git commit -m "proof: Pages workflow $GITHUB_RUN_ID for $GITHUB_SHA" || true
          git push --force origin deployment-proof
