<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070912" />
    <meta name="description" content="One Bullet Arena is a fast browser action game where every shot must be recovered." />
    <title>One Bullet Arena</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ABUD FUN / WEB GAME</p>
          <h1>One Bullet Arena</h1>
        </div>
        <a href="https://github.com/3bud-ZC/One-Bullet-Arena" target="_blank" rel="noreferrer">Source code</a>
      </header>

      <section class="game-frame" aria-label="One Bullet Arena game">
        <canvas id="game-canvas" aria-label="Game canvas"></canvas>

      </footer>
    </main>
    <script type="module" src="./src/main.js"></script>

</html>
