name: Temporary Mobile Dashboard Refinement

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'dashboard-reference-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply stacked mobile dashboard
        run: python tools/mobile_dashboard_stack.py
      - name: Static verification
        run: |
          node --check src/core/ui-repair-runtime.js
          git diff --check
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ui-repair-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add stacked mobile dashboard composition [mobile-dashboard]"
          git push origin HEAD:${{ github.head_ref }}