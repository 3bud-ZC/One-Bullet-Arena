name: Temporary Dashboard Postfix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  postfix:
    if: github.head_ref == 'dashboard-reference-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply localization and checkpoint safety cleanup
        run: python tools/post_dashboard_reference_fix.py
      - name: Static verification
        run: |
          node --check src/core/ui-repair-runtime.js
          node --check src/i18n.js
          node --check tests/browser/ui-repair.spec.js
          git diff --check
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ui-repair-runtime.js src/i18n.js tests/browser/ui-repair.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete dashboard RTL and checkpoint safety [dashboard-postfix]"
          git push origin HEAD:${{ github.head_ref }}