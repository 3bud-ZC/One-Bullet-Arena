<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030611" />
    <meta name="description" content="حلبة الطلقة الواحدة — اهزم كل موجة واختر قدرة جديدة في ساحة تتوسع تلقائيًا." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One Bullet" />
    <title>حلبة الطلقة الواحدة</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/app-icon.svg" />
    <link rel="stylesheet" href="./game.css" />
    <link rel="stylesheet" href="./art-direction.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-frame" aria-label="لعبة حلبة الطلقة الواحدة">
        <canvas
          id="game-canvas"
          aria-label="لوحة لعبة حلبة الطلقة الواحدة"
          aria-describedby="game-instructions"
        ></canvas>
      </section>
      <aside class="orientation-hint" role="status" aria-live="polite">
        <strong>لف الهاتف للوضع الأفقي</strong>
        <span>اللعبة مصممة للتحكم باليدين في الوضع الأفقي.</span>
      </aside>
      <p id="game-instructions" class="visually-hidden">
        لعبة بطلقة واحدة. تحرك، أطلق الطلقة، استدعها، ثم اختر تطويرًا بعد كل موجة.
      </p>
      <p id="game-status" class="visually-hidden" aria-live="polite"></p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
