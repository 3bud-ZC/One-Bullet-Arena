name: Apply Dashboard Reference

# One-shot transformer for the dashboard-reference-polish branch.
# This file is temporary and removed before final merge.
on:
  push:
    branches:
      - dashboard-reference-polish
    paths:
      - tools/apply_dashboard_reference.py
      - .github/workflows/apply-dashboard-reference.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dashboard redesign
        run: python tools/apply_dashboard_reference.py
      - name: Static verification
        run: |
          node --check src/core/ui-repair-runtime.js
          node --check src/ui-system.js
          node --check src/i18n.js
          git diff --check
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/ui-repair-runtime.js src/ui-system.js src/i18n.js src/release-config.js package.json tests .github/workflows
          git reset .github/workflows/apply-dashboard-reference.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "feat: rebuild dashboard from premium tactical reference [dashboard-applied]"
          git push