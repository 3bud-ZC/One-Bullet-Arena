name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify:all
      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html game.css art-direction.css manifest.webmanifest sw.js _site/
          cp -R src icons _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/game.css
          test -f _site/art-direction.css
          test -f _site/sw.js
          test -f _site/manifest.webmanifest
          test -f _site/icons/app-icon.svg
          test -f _site/src/release-config.js
          test -f _site/src/release.js
          test -f _site/src/core/game-events.js
          test -f _site/src/core/event-bus.js
          test -f _site/src/core/game-states.js
          test -f _site/src/core/event-runtime.js
          test -f _site/src/core/combat-depth-runtime.js
          test -f _site/src/core/checkpoint-store.js
          test -f _site/src/core/checkpoint-runtime.js
          test -f _site/src/core/warden-runtime.js
          test -f _site/src/core/world-2d-runtime.js
          test -f _site/src/core/visual-overhaul-runtime.js
          test -f _site/src/core/art-direction-runtime.js
          test -f _site/src/game.js
          test -f _site/src/game-runtime.js
          test -f _site/src/input-controller.js
          test -f _site/src/spawn-system.js
          test -f _site/src/ui-renderer.js
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          grep -q "const version = '$EXPECTED_VERSION'" _site/src/release-config.js
          grep -q "art-direction.css" _site/index.html
          grep -q "art-direction.css" _site/sw.js
          grep -q "release-config.js" _site/sw.js
          grep -q "core/event-runtime.js" _site/sw.js
          grep -q "core/combat-depth-runtime.js" _site/sw.js
          grep -q "core/checkpoint-runtime.js" _site/sw.js
          grep -q "core/warden-runtime.js" _site/sw.js
          grep -q "core/world-2d-runtime.js" _site/sw.js
          grep -q "core/visual-overhaul-runtime.js" _site/sw.js
          grep -q "core/art-direction-runtime.js" _site/sw.js
          grep -q "OneBulletArtDirectionRuntime" _site/src/main.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
